name: Auto Blog Publish

on:
  schedule:
    # 매일 3번 시도합니다. 글은 하루 한 편만 발행됩니다
    # (스크립트가 오늘 글이 이미 있으면 그냥 종료).
    # 첫 실행이 실패해도 2시간 뒤, 4시간 뒤 예비 실행이 대신 발행해서
    # 글이 누락되는 날이 없도록 합니다.
    - cron: '0 1 * * *'   # UTC 01:00 = 한국시간 오전 10시
    - cron: '0 3 * * *'   # UTC 03:00 = 한국시간 낮 12시 (예비)
    - cron: '0 5 * * *'   # UTC 05:00 = 한국시간 오후 2시 (예비)
  workflow_dispatch:        # "지금 바로 실행" 버튼으로도 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog.js

      - name: Commit and push
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add blog/ sitemap.xml robots.txt
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "자동 블로그 발행 $(date +'%Y-%m-%d')"
          # 실행 도중 다른 커밋(직접 업로드 등)이 먼저 올라가면 push가 거절됩니다.
          # 그 경우 원격 변경을 받아온 뒤 다시 push합니다 (최대 3번).
          for i in 1 2 3; do
            git push && exit 0
            echo "push 실패, 원격 변경을 받아서 재시도 ($i/3)"
            git pull --rebase origin main
          done
          git push
